# Releases: `just release`. Bumps Cargo.toml and Cargo.lock in lockstep from the
# conventional commits since the last tag, writes CHANGELOG.md, rescans the
# licence lock, commits and tags. Pushing and publishing (crates.io) stay manual.

[package]
versioned_files = [
    "Cargo.toml",
    { path = "Cargo.lock", dependency = "preset-compliance" },
]
changelog = "CHANGELOG.md"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Command"
command = "just check"

[[workflows.steps]]
type = "PrepareRelease"

# The licence lock hashes Cargo.toml and Cargo.lock, so a bump makes it stale.
[[workflows.steps]]
type = "Command"
command = "just scan && git add preset-compliance.lock"
shell = true

[[workflows.steps]]
type = "Command"
command = "git commit -m \"release: $version\""
variables = { "$version" = "Version" }

[[workflows.steps]]
type = "Release"
