version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "altgraph"
version = "0.17.5"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "demo"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "demo-kernels" },
    { name = "numpy" },
    { name = "vendored" },
]

[package.optional-dependencies]
fonts = [
    { name = "tinyfont" },
]

[package.dev-dependencies]
dev = [
    { name = "packaging" },
    { name = "pyinstaller" },
    { name = "pytest" },
]

[[package]]
name = "demo-kernels"
version = "0.1.0"
source = { directory = "kernels" }
dependencies = [
    { name = "kernel-helper", extra = ["fast"] },
]

[[package]]
name = "iniconfig"
version = "2.3.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "kernel-helper"
version = "1.0.0"
source = { registry = "https://pypi.org/simple" }

[package.optional-dependencies]
fast = [
    { name = "speedy" },
]

[[package]]
name = "numpy"
version = "2.5.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "packaging"
version = "24.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pyinstaller"
version = "6.21.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "altgraph" },
    { name = "packaging" },
]

[[package]]
name = "pytest"
version = "8.3.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "iniconfig" },
    { name = "packaging" },
]

[[package]]
name = "speedy"
version = "0.1.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "tinyfont"
version = "1.2.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "packaging" },
]

[[package]]
name = "vendored"
version = "0.3.0"
source = { git = "https://github.com/x/vendored?rev=abc#abc123" }
